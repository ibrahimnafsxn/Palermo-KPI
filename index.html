<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Palermo Perfumes — Weekly KPI Report</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-text-size-adjust:100%;}
  body{font-family:Arial,sans-serif;background:#f5f4f1;padding:20px 12px;color:#1a1a1a;}
  .wrap{max-width:900px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.10);}
  .hdr{background:#1a1a1a;padding:24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:12px 12px 0 0;}
  .logo{width:46px;height:46px;border-radius:8px;border:2px solid #d4af6a;display:flex;align-items:center;justify-content:center;color:#d4af6a;font-weight:900;font-size:14px;letter-spacing:.1em;flex-shrink:0;}
  .htxt{flex:1;min-width:140px;}
  .htxt h1{color:#d4af6a;font-size:16px;font-weight:700;margin-bottom:2px;}
  .htxt p{color:#a89060;font-size:12px;}
  .wbadge{display:flex;flex-direction:column;gap:4px;}
  .wbadge label{font-size:10px;color:#a89060;letter-spacing:.07em;text-transform:uppercase;}
  .wbadge input{font-size:13px;font-weight:700;color:#d4af6a;background:transparent;border:1px solid #d4af6a;border-radius:6px;padding:6px 10px;width:145px;outline:none;font-family:Arial,sans-serif;-webkit-appearance:none;}
  .wbadge input::placeholder{color:#6b5c3a;font-weight:400;}
  .body{padding:20px 16px;}
  .scards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
  .sc{background:#f7f6f3;border-radius:8px;padding:12px;}
  .sc.gold{background:#1a1a1a;}
  .sc .sl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}
  .sc.gold .sl{color:#a89060;}
  .sc .sv{font-size:18px;font-weight:700;color:#1a1a1a;}
  .sc.gold .sv{color:#d4af6a;}
  .sc .ss{font-size:11px;color:#999;margin-top:3px;}
  .sc.gold .ss{color:#6b5c3a;}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:20px;}
  table{width:100%;min-width:560px;border-collapse:collapse;font-size:13px;}
  thead th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#999;padding:9px 10px;border-bottom:2px solid #eee;text-align:left;background:#f7f6f3;white-space:nowrap;}
  thead th.r{text-align:right;}
  tbody td{padding:8px 10px;border-bottom:1px solid #f0f0f0;vertical-align:middle;}
  tbody td.r{text-align:right;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:nth-child(even){background:#fafafa;}
  .day-name{font-weight:700;color:#1a1a1a;white-space:nowrap;font-size:13px;}
  /* hidden inputs for data entry — not shown as columns */
  .hidden-inputs{display:none;}
  .in-date{font-size:12px;color:#555;width:72px;border:1px solid #e0e0e0;border-radius:5px;padding:4px 6px;background:#fff;outline:none;font-family:Arial,sans-serif;-webkit-appearance:none;}
  .in-res{font-size:13px;color:#1a1a1a;width:90px;border:1px solid #e0e0e0;border-radius:5px;padding:4px 6px;background:#fff;outline:none;text-align:right;font-family:Arial,sans-serif;-webkit-appearance:none;}
  .in-kpi{font-size:13px;color:#1a1a1a;width:90px;border:1px solid #e0e0e0;border-radius:5px;padding:4px 6px;background:#fff;outline:none;text-align:right;font-family:Arial,sans-serif;-webkit-appearance:none;}
  .in-sm{font-size:13px;color:#1a1a1a;width:70px;border:1px solid #e0e0e0;border-radius:5px;padding:4px 6px;background:#fff;outline:none;text-align:right;font-family:Arial,sans-serif;-webkit-appearance:none;}
  input:focus{border-color:#d4af6a!important;}
  .badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;background:#f0f0f0;color:#999;}
  .team-sc{font-weight:700;color:#1a1a1a;}
  .kpi-sc{color:#aaa;}
  .btns{display:flex;gap:10px;flex-wrap:wrap;}
  .btn-p{padding:11px 22px;border-radius:7px;border:none;background:#1a1a1a;color:#d4af6a;font-size:13px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;-webkit-appearance:none;}
  .btn-p:hover{background:#2a2a2a;}
  .btn-s{padding:11px 22px;border-radius:7px;border:1px solid #ddd;background:#fff;color:#666;font-size:13px;cursor:pointer;font-family:Arial,sans-serif;-webkit-appearance:none;}
  .btn-s:hover{background:#f5f5f5;}
  .ftr{border-top:1px solid #eee;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:20px;border-radius:0 0 12px 12px;}
  .ftr span{font-size:11px;color:#ccc;}
  @media(min-width:640px){.body{padding:28px 32px;}.hdr{padding:28px 32px;}.scards{grid-template-columns:repeat(4,1fr);}.ftr{padding:14px 32px;}}
  @media print{body{background:#fff;padding:0;}.wrap{box-shadow:none;border-radius:0;}.btns{display:none;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="logo">PP</div>
    <div class="htxt">
      <h1>Palermo Perfumes</h1>
      <p>Weekly KPI performance report</p>
    </div>
    <div class="wbadge">
      <label>Week ending</label>
      <input type="text" id="week-end" placeholder="e.g. 03-8-2026" oninput="recalc()"/>
    </div>
  </div>

  <div class="body">
    <div class="scards">
      <div class="sc gold">
        <div class="sl">Weekly team result</div>
        <div class="sv" id="s-total">—</div>
        <div class="ss" id="s-kpi-total">Enter data below</div>
      </div>
      <div class="sc">
        <div class="sl">vs KPI</div>
        <div class="sv" id="s-pct">—</div>
        <div class="ss" id="s-diff"></div>
      </div>
      <div class="sc">
        <div class="sl">Days at/above KPI</div>
        <div class="sv" id="s-days">0 / 0</div>
        <div class="ss" id="s-hitrate">Enter data below</div>
      </div>
      <div class="sc">
        <div class="sl">Best day</div>
        <div class="sv" id="s-best" style="font-size:16px">—</div>
        <div class="ss" id="s-best-pct"></div>
      </div>
    </div>

    <!-- Hidden input area — where you type numbers, NOT shown as table columns -->
    <div style="background:#f7f6f3;border-radius:8px;padding:14px;margin-bottom:16px;">
      <div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;">Enter daily data</div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
        <table style="width:100%;min-width:560px;border-collapse:collapse;font-size:13px;">
          <thead>
            <tr>
              <th style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#999;padding:7px 8px;text-align:left;white-space:nowrap;">Day</th>
              <th style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#999;padding:7px 8px;text-align:left;">Date</th>
              <th style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#999;padding:7px 8px;text-align:right;">Actual result ($)</th>
              <th style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#999;padding:7px 8px;text-align:right;">KPI target ($)</th>
              <th style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#999;padding:7px 8px;text-align:right;">AOV ($)</th>
              <th style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#999;padding:7px 8px;text-align:right;">IPU</th>
            </tr>
          </thead>
          <tbody id="input-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Results table — no input columns, clean display only -->
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Day</th>
            <th>Date</th>
            <th class="r">vs KPI</th>
            <th class="r">Team score</th>
            <th class="r">KPI score</th>
            <th class="r">AOV ($)</th>
            <th class="r">IPU</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>

    <div class="btns">
      <button class="btn-p" onclick="saveReport()">Save report</button>
      <button class="btn-s" onclick="clearAll()">Clear all</button>
    </div>
  </div>

  <div class="ftr">
    <span>Palermo Perfumes</span>
    <span id="gen-date"></span>
  </div>
</div>

<script>
var DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
document.getElementById('gen-date').textContent='Generated '+new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});

// Build input rows
var inputBody=document.getElementById('input-body');
for(var i=0;i<7;i++){
  var tr=document.createElement('tr');
  tr.style.borderBottom='1px solid #eee';
  tr.innerHTML=
    '<td style="padding:6px 8px;font-weight:700;font-size:13px;white-space:nowrap;">'+DAYS[i]+'</td>'+
    '<td style="padding:6px 8px;"><input type="text" class="in-date" placeholder="DD/MM" oninput="recalc()"/></td>'+
    '<td style="padding:6px 8px;text-align:right;"><input type="number" class="in-res" placeholder="0" oninput="recalc()"/></td>'+
    '<td style="padding:6px 8px;text-align:right;"><input type="number" class="in-kpi" placeholder="0" oninput="recalc()"/></td>'+
    '<td style="padding:6px 8px;text-align:right;"><input type="number" class="in-sm" placeholder="0.00" step="0.01" oninput="recalc()"/></td>'+
    '<td style="padding:6px 8px;text-align:right;"><input type="number" class="in-sm" placeholder="0.00" step="0.01" oninput="recalc()"/></td>';
  inputBody.appendChild(tr);
}

function getRows(){
  var out=[],trs=document.querySelectorAll('#input-body tr');
  for(var i=0;i<trs.length;i++){
    var ins=trs[i].querySelectorAll('input');
    out.push({day:DAYS[i],date:ins[0].value,result:ins[1].value,kpi:ins[2].value,aov:ins[3].value,ipu:ins[4].value});
  }
  return out;
}

function calcPct(kpi,res){var k=parseFloat(kpi),r=parseFloat(res);if(!k||!r||isNaN(k)||isNaN(r))return null;return((r-k)/k)*100;}
function money(n){return'$'+Math.round(n).toLocaleString();}
function moneyD(n){return'$'+parseFloat(n).toFixed(2);}
function numD(n){return parseFloat(n).toFixed(2);}

function recalc(){
  var rows=getRows(),tKPI=0,tRes=0,abv=0,cnt=0,bestI=-1,bestP=-Infinity;

  // Build results table
  var rb=document.getElementById('results-body');
  rb.innerHTML='';
  for(var i=0;i<rows.length;i++){
    var kv=parseFloat(rows[i].kpi),rv=parseFloat(rows[i].result),p=calcPct(rows[i].kpi,rows[i].result);
    var av=parseFloat(rows[i].aov),iv=parseFloat(rows[i].ipu);

    var badgeTxt='—',badgeBg='#f0f0f0',badgeCol='#999';
    if(p!==null){badgeTxt=(p>=0?'▲ +':'▼ ')+Math.abs(p).toFixed(1)+'%';badgeBg=p>=0?'#EAF3DE':'#FCEBEB';badgeCol=p>=0?'#3B6D11':'#A32D2D';}

    var tr=document.createElement('tr');
    if(i%2!==0)tr.style.background='#fafafa';
    tr.innerHTML=
      '<td style="padding:9px 10px;font-weight:700;color:#1a1a1a;border-bottom:1px solid #f0f0f0;white-space:nowrap;">'+rows[i].day+'</td>'+
      '<td style="padding:9px 10px;color:#888;font-size:12px;border-bottom:1px solid #f0f0f0;">'+(rows[i].date||'—')+'</td>'+
      '<td style="padding:9px 10px;text-align:right;border-bottom:1px solid #f0f0f0;"><span style="display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;background:'+badgeBg+';color:'+badgeCol+';">'+badgeTxt+'</span></td>'+
      '<td style="padding:9px 10px;text-align:right;font-weight:700;color:#1a1a1a;border-bottom:1px solid #f0f0f0;">'+(rows[i].result?money(rv):'—')+'</td>'+
      '<td style="padding:9px 10px;text-align:right;color:#aaa;border-bottom:1px solid #f0f0f0;">'+(rows[i].kpi?money(kv):'—')+'</td>'+
      '<td style="padding:9px 10px;text-align:right;color:#555;border-bottom:1px solid #f0f0f0;">'+(rows[i].aov?moneyD(av):'—')+'</td>'+
      '<td style="padding:9px 10px;text-align:right;color:#555;border-bottom:1px solid #f0f0f0;">'+(rows[i].ipu?numD(iv):'—')+'</td>';
    rb.appendChild(tr);

    if(rows[i].kpi&&rows[i].result&&!isNaN(kv)&&!isNaN(rv)){tKPI+=kv;tRes+=rv;cnt++;if(rv>=kv)abv++;if(p!==null&&p>bestP){bestP=p;bestI=i;}}
  }

  var tp=tKPI>0?((tRes-tKPI)/tKPI*100):null,diff=tRes-tKPI;
  document.getElementById('s-total').textContent=cnt?money(tRes):'—';
  document.getElementById('s-kpi-total').textContent=cnt?'KPI: '+money(tKPI):'Enter data below';
  var pEl=document.getElementById('s-pct');
  pEl.textContent=tp===null?'—':(tp>=0?'+':'')+tp.toFixed(1)+'%';
  pEl.style.color=tp===null?'#1a1a1a':tp>=0?'#3B6D11':'#A32D2D';
  document.getElementById('s-diff').textContent=cnt?money(Math.abs(Math.round(diff)))+' '+(diff>=0?'above':'below')+' target':'';
  document.getElementById('s-days').textContent=abv+' / '+cnt;
  document.getElementById('s-hitrate').textContent=cnt?Math.round((abv/cnt)*100)+'% hit rate':'Enter data below';
  document.getElementById('s-best').textContent=bestI>=0?DAYS[bestI]:'—';
  document.getElementById('s-best-pct').textContent=bestI>=0?(bestP>=0?'+':'')+bestP.toFixed(1)+'% vs KPI':'';
}

function clearAll(){
  var ins=document.querySelectorAll('#input-body input');
  for(var i=0;i<ins.length;i++)ins[i].value='';
  document.getElementById('week-end').value='';
  recalc();
}

function saveReport(){
  var we=document.getElementById('week-end').value||'Week';
  var rows=getRows(),tKPI=0,tRes=0,abv=0,cnt=0,bestI=-1,bestP=-Infinity,trows='';
  for(var i=0;i<rows.length;i++){
    var kv=parseFloat(rows[i].kpi),rv=parseFloat(rows[i].result),p=calcPct(rows[i].kpi,rows[i].result);
    var av=parseFloat(rows[i].aov),iv=parseFloat(rows[i].ipu);
    if(rows[i].kpi&&rows[i].result&&!isNaN(kv)&&!isNaN(rv)){tKPI+=kv;tRes+=rv;cnt++;if(rv>=kv)abv++;if(p!==null&&p>bestP){bestP=p;bestI=i;}}
    var pl=p===null?'—':(p>=0?'▲ +':'▼ ')+Math.abs(p).toFixed(1)+'%';
    var pc=p===null?'#888':p>=0?'#3B6D11':'#A32D2D';
    var pb=p===null?'#f0f0f0':p>=0?'#EAF3DE':'#FCEBEB';
    var bg=i%2!==0?'#fafafa':'#fff';
    trows+='<tr style="background:'+bg+'">'+
      '<td style="padding:10px 14px;font-weight:700;border-bottom:1px solid #eee;">'+rows[i].day+'</td>'+
      '<td style="padding:10px 14px;color:#888;font-size:13px;border-bottom:1px solid #eee;">'+(rows[i].date||'—')+'</td>'+
      '<td style="padding:10px 14px;text-align:right;border-bottom:1px solid #eee;"><span style="display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:'+pb+';color:'+pc+';">'+pl+'</span></td>'+
      '<td style="padding:10px 14px;text-align:right;font-weight:700;border-bottom:1px solid #eee;">'+(rows[i].result?money(rv):'—')+'</td>'+
      '<td style="padding:10px 14px;text-align:right;color:#aaa;border-bottom:1px solid #eee;">'+(rows[i].kpi?money(kv):'—')+'</td>'+
      '<td style="padding:10px 14px;text-align:right;color:#555;border-bottom:1px solid #eee;">'+(rows[i].aov?moneyD(av):'—')+'</td>'+
      '<td style="padding:10px 14px;text-align:right;color:#555;border-bottom:1px solid #eee;">'+(rows[i].ipu?numD(iv):'—')+'</td>'+
      '</tr>';
  }
  var tp=tKPI>0?((tRes-tKPI)/tKPI*100):null,diff=tRes-tKPI;
  var pCol=tp===null?'#1a1a1a':tp>=0?'#3B6D11':'#A32D2D';
  var dTxt=cnt?money(Math.abs(Math.round(diff)))+' '+(diff>=0?'above':'below')+' target':'';

  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>Palermo Perfumes \u2014 Week ending '+we+'</title>'+
    '<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Arial,sans-serif;background:#f5f4f1;padding:24px 12px;color:#1a1a1a;}.wrap{max-width:820px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.1);}.hdr{background:#1a1a1a;padding:24px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}.logo{width:46px;height:46px;border-radius:8px;border:2px solid #d4af6a;display:flex;align-items:center;justify-content:center;color:#d4af6a;font-weight:900;font-size:14px;flex-shrink:0;}.htxt{flex:1;}.htxt h1{color:#d4af6a;font-size:17px;font-weight:700;margin-bottom:2px;}.htxt p{color:#a89060;font-size:12px;}.wb{border:1px solid #d4af6a;border-radius:7px;padding:7px 12px;flex-shrink:0;text-align:right;}.wb .wl{font-size:10px;color:#a89060;letter-spacing:.07em;text-transform:uppercase;}.wb .wv{font-size:14px;color:#d4af6a;font-weight:700;}.body{padding:20px 16px;}.sc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}.sc{background:#f7f6f3;border-radius:8px;padding:12px;}.sc.g{background:#1a1a1a;}.sl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;}.sc.g .sl{color:#a89060;}.sv{font-size:18px;font-weight:700;color:#1a1a1a;}.sc.g .sv{color:#d4af6a;}.ss{font-size:11px;color:#999;margin-top:3px;}.sc.g .ss{color:#6b5c3a;}.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;}table{width:100%;min-width:500px;border-collapse:collapse;font-size:13px;}th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#999;padding:9px 12px;border-bottom:2px solid #eee;text-align:left;background:#f7f6f3;white-space:nowrap;}th.r{text-align:right;}.ftr{border-top:1px solid #eee;padding:12px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:20px;}.ftr span{font-size:11px;color:#ccc;}@media(min-width:600px){.body{padding:28px 32px;}.hdr{padding:28px 32px;}.sc-grid{grid-template-columns:repeat(4,1fr);}.ftr{padding:14px 32px;}}@media print{body{background:#fff;padding:0;}.wrap{box-shadow:none;border-radius:0;}}</style>'+
    '</head><body><div class="wrap">'+
    '<div class="hdr"><div class="logo">PP</div><div class="htxt"><h1>Palermo Perfumes</h1><p>Weekly KPI performance report</p></div><div class="wb"><div class="wl">Week ending</div><div class="wv">'+we+'</div></div></div>'+
    '<div class="body"><div class="sc-grid">'+
    '<div class="sc g"><div class="sl">Weekly team result</div><div class="sv">'+(cnt?money(tRes):'—')+'</div><div class="ss">KPI: '+(cnt?money(tKPI):'—')+'</div></div>'+
    '<div class="sc"><div class="sl">vs KPI</div><div class="sv" style="color:'+pCol+'">'+(tp===null?'—':(tp>=0?'+':'')+tp.toFixed(1)+'%')+'</div><div class="ss">'+dTxt+'</div></div>'+
    '<div class="sc"><div class="sl">Days at/above KPI</div><div class="sv">'+abv+' / '+cnt+'</div><div class="ss">'+(cnt?Math.round((abv/cnt)*100)+'% hit rate':'—')+'</div></div>'+
    '<div class="sc"><div class="sl">Best day</div><div class="sv" style="font-size:15px">'+(bestI>=0?DAYS[bestI]:'—')+'</div><div class="ss">'+(bestI>=0?(bestP>=0?'+':'')+bestP.toFixed(1)+'% vs KPI':'')+'</div></div>'+
    '</div><div class="tbl"><table><thead><tr>'+
    '<th>Day</th><th>Date</th><th class="r">vs KPI</th><th class="r">Team score</th><th class="r">KPI score</th><th class="r">AOV ($)</th><th class="r">IPU</th>'+
    '</tr></thead><tbody>'+trows+'</tbody></table></div></div>'+
    '<div class="ftr"><span>Palermo Perfumes</span><span>Generated '+new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})+'</span></div>'+
    '</div></body></html>';

  var blob=new Blob([html],{type:'text/html'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='Palermo_KPI_Week_'+we.replace(/[^a-zA-Z0-9]/g,'-')+'.html';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
}

recalc();
</script>
</body>
</html>
